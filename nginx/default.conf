server {
    listen 80;

    server_name _;

    client_max_body_size 20M;

    location /static/ {
        alias /app/staticfiles/;
    }

    # Os anexos NÃO são públicos. `internal` faz o nginx recusar qualquer
    # pedido vindo do navegador e só atender o X-Accel-Redirect emitido pela
    # view `baixar_anexo_ideia`, que já conferiu login e permissão.
    location /media/ {
        internal;
        alias /app/media/;

        # Impede que o navegador reinterprete o tipo do arquivo — a defesa
        # contra um "documento" que na verdade carrega HTML com script.
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    location / {
        proxy_pass http://web:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}